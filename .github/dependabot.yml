# ============================================================
# .github/dependabot.yml
# Configuración de Dependabot: bot que revisa dependencias
# automáticamente y crea Pull Requests con actualizaciones.
# ============================================================

version: 2
updates:

  # ----------------------------------------------------------
  # Dependencias de Maven (pom.xml)
  # ----------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ----------------------------------------------------------
  # Imágenes de Docker (Dockerfile)
  # ----------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # ----------------------------------------------------------
  # GitHub Actions (workflows)
  # ----------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Evita actualizaciones incompatibles entre upload-artifact y download-artifact.
      # Las versiones 4 y 7 NO son compatibles entre sí.
      # Mientras el workflow use upload-artifact@v4, hay que bloquear download-artifact@v7.
      - dependency-name: "actions/download-artifact"
        versions: ["6.x", "7.x"]
      - dependency-name: "actions/upload-artifact"
        versions: ["5.x", "6.x", "7.x"]
